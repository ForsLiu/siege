name: milestone-notify
# Opens a GitHub issue (which @mentions the repo owner) whenever a new line lands in MILESTONES.md on main.
on:
  push:
    branches: [main]
    paths: [MILESTONES.md]
permissions:
  contents: read
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('MILESTONES.md', 'utf8')
              .split('\n').map(l => l.trim()).filter(l => l.startsWith('- '));
            if (lines.length === 0) return;
            const last = lines[lines.length - 1];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Siege milestone: ' + last.slice(2, 120),
              body: '@' + context.repo.owner + '\n\n' + last +
                    '\n\nCommit: ' + context.sha + '\nDetails: PROGRESS.md and BACKLOG.md on main.'
            });
